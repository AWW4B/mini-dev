# FILE: pyproject.toml
# ROLE: Project metadata, exact dependency pins, extras, dev group, console script and tool configuration (ruff, mypy, pytest markers).
# ARCH REF: D-01; D-02; D-03; D-44; D-11; D-14b-S; D-28; D-33; D-35; D-40
# OWNS: Dependency declarations and tool config
# DOES NOT OWN: Resolved versions (uv.lock)
# CONNECTS TO (external boundaries only):
#   - imports from none: none
#   - emits/consumes: none
# INSTRUCTIONS (strict, imperative):
#   1. Implement only this file. If this file's contract with another file must change, stop and report; do not edit the other file.
#   2. Keep every public name and signature declared below exactly as written; they are the contract other files rely on.
#   3. Use only the standard library, the pinned dependencies in pyproject.toml, and the files listed under CONNECTS TO. Ask before adding a dependency.
#   4. Open text files with encoding="utf-8" explicitly.
#   5. Pins are exact (==); change them only with `uv lock` and commit uv.lock and requirements.lock.txt together (scripts/export_requirements.py).
#   6. The console script points at src/asf/cli/app.py main().
#   7. System packages (checked by `factory doctor`, never assumed): Debian/Ubuntu: apt install git ripgrep bubblewrap; Arch: pacman -S git ripgrep bubblewrap; Windows: winget install Git.Git BurntSushi.ripgrep.MSVC astral-sh.uv (sandbox: srt or WSL2). uv itself: official installer on each OS.
#   8. Python range is >=3.12,<3.15; CI covers 3.12, 3.13 and 3.14.
# FORBIDDEN: shell=True; os.system; hardcoded absolute paths; container runtimes; importing project modules not listed under CONNECTS TO; printing secrets or API keys
# ERRORS: Raise a subclass of asf.contracts.errors.AsfError with an actionable message; never swallow exceptions silently.
# DONE WHEN: (1) `uv run python scripts/check_headers.py` reports no problem for this file.

[project]
name = "ai-software-factory"
version = "0.0.1"
description = "Local-first AI software factory (CLI). Source-available; see LICENSE."
readme = "README.md"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.15"
dependencies = [
  "typer==0.27.3", "rich==15.0.0", "questionary==2.1.1",
  "langgraph==1.2.20", "langgraph-checkpoint-sqlite==3.1.3", "langchain-core==1.7.6",
  "langchain-openai==1.7.4", "langchain-mcp-adapters==0.3.2", "mcp==1.30.0",
  "pydantic==2.14.3", "pydantic-settings==2.16.2", "platformdirs==4.14.5", "keyring==25.7.0",
  "structlog==26.1.0", "tomlkit==0.15.2", "psutil==7.2.2", "nvidia-ml-py==13.615.71",
  "portalocker==4.4.2", "markitdown[docx,pdf]==0.1.9", "pypdf==7.0.0", "tree-sitter==0.26.0",
  "tree-sitter-language-pack==1.25.0", "tiktoken==0.14.0", "httpx==0.28.1",
  "pywin32==312; sys_platform == 'win32'",
]
[project.optional-dependencies]
web = ["starlette==1.10.0", "uvicorn==0.54.0"]
docs-advanced = ["docling==2.148.0"]
anthropic = ["langchain-anthropic==1.7.10"]
gemini = ["langchain-google-genai==4.4.3"]
[dependency-groups]
dev = ["pytest==9.2.0", "pytest-timeout==2.4.0", "hypothesis==6.170.15", "ruff==0.17.4", "mypy==2.4.1", "coverage==7.17.2", "types-psutil==7.2.2.20260906"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/asf"]

[project.scripts]
factory = "asf.cli.app:main"

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]  # long header comment lines; the formatter wraps code

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S603"]
"tests/scripts/*" = ["S603"]
"tests/web/*" = ["S104"]  # the bind-refusal test lists forbidden addresses on purpose

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["asf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
timeout = 120
markers = [
  "windows_only: runs only on Windows",
  "linux_only: runs only on Linux",
  "needs_gpu: requires an NVIDIA GPU (opt-in)",
  "needs_sandbox: requires a tier-A sandbox (opt-in)",
  "needs_network: requires network access (opt-in)",
  "slow: long-running",
]
