# FILE: src/asf/config/defaults/memory.toml
# ROLE: Packaged defaults for the memory architecture: device shares, per-layer context shares, retention and tool-output rules, all as percentages.
# ARCH REF: M5; p12 Context & Memory Service; docs/architecture/MEMORY_ARCHITECTURE.md
# OWNS: Default percentages, the local model catalogue, the beta switch for tree retrieval
# DOES NOT OWN: Model routing (models.toml); factory settings (factory.toml)
# CONNECTS TO (external boundaries only):
#   - imports from none: none
#   - emits/consumes: none
# INSTRUCTIONS (strict, imperative):
#   1. Implement only this file. If this file's contract with another file must change, stop and report; do not edit the other file.
#   2. Keep every public name and signature declared below exactly as written; they are the contract other files rely on.
#   3. Use only the standard library, the pinned dependencies in pyproject.toml, and the files listed under CONNECTS TO. Ask before adding a dependency.
#   4. Open text files with encoding="utf-8" explicitly.
#   5. Every limit is a percentage (0-100) of a measured quantity, never a fixed token or byte count. Each [layers.<role>] table must sum to 100.
#   6. Keys must match src/asf/m5_shared/memory/device_budget.py and src/asf/m5_shared/memory/budgets.py exactly.
# FORBIDDEN: shell=True; os.system; hardcoded absolute paths; container runtimes; importing project modules not listed under CONNECTS TO; printing secrets or API keys
# ERRORS: Raise a subclass of asf.contracts.errors.AsfError with an actionable message; never swallow exceptions silently.
# DONE WHEN: (1) `uv run python scripts/check_headers.py` reports no problem for this file.

# ---------------------------------------------------------------------------------------------------------------------
# Device shares. Each limit is the smaller of "% of the device total" and "% of what is free right now", so the factory
# never takes the whole machine, and never more than is actually free when it starts.
# ---------------------------------------------------------------------------------------------------------------------
[device]
# everything mini-dev may use together (its own process + the local model servers)
total_ram_pct = 60
total_ram_free_pct = 80          # of RAM available at start
vram_pct = 85                    # local models only; leave room for the desktop/compositor
vram_free_pct = 95
cpu_threads_pct = 75             # worker threads + model server threads
disk_free_pct = 5                # memory database + offloaded tool output + blobs

# split of the RAM share above
process_ram_pct = 15             # the factory's own Python process (caches, indexes, sqlite page cache)
models_ram_pct = 85              # CPU-resident models (T1) and any GPU spill of T2
sqlite_cache_pct = 10            # of the process share: SQLite page cache of the memory database

# a model that does not fit fully in VRAM may spill to RAM only while this much of it stays on the GPU
min_gpu_fraction_pct = 85
# runtime overhead of a llama.cpp server on top of weights + KV cache (compute buffers, CUDA context)
runtime_overhead_pct = 12
# KV cache precision: q8_0 halves the fp16 size with negligible quality loss for code
kv_cache_bytes_pct = 50
# context sizes the planner may choose from (powers of two that llama-server accepts)
context_candidates = [4096, 8192, 16384, 32768]

# Local model catalogue: weights are GGUF Q4_K_M file sizes; kv_bytes_per_token is fp16 (2 * layers * kv_heads * head_dim * 2).
# quality is a coarse rank used only to prefer the stronger model that fits.
[[device.catalog]]
name = "Qwen3-1.7B-Instruct-Q4_K_M"
roles = ["T1"]
weights_gb = 1.11
kv_bytes_per_token = 114688
max_context = 32768
quality = 1
placement = "cpu"

[[device.catalog]]
name = "Qwen3-4B-Instruct-Q4_K_M"
roles = ["T1", "T2"]
weights_gb = 2.50
kv_bytes_per_token = 147456
max_context = 32768
quality = 2
placement = "gpu"

[[device.catalog]]
name = "Qwen2.5-Coder-3B-Instruct-Q4_K_M"
roles = ["T2"]
weights_gb = 1.93
kv_bytes_per_token = 36864
max_context = 32768
quality = 2
placement = "gpu"

[[device.catalog]]
name = "Qwen2.5-Coder-7B-Instruct-Q4_K_M"
roles = ["T2"]
weights_gb = 4.68
kv_bytes_per_token = 57344
max_context = 32768
quality = 3
placement = "gpu"

[[device.catalog]]
name = "Qwen2.5-Coder-14B-Instruct-Q4_K_M"
roles = ["T2"]
weights_gb = 8.99
kv_bytes_per_token = 196608
max_context = 32768
quality = 4
placement = "gpu"

[[device.catalog]]
name = "Qwen3-Coder-30B-A3B-Instruct-Q4_K_M"
roles = ["T2"]
weights_gb = 18.6
