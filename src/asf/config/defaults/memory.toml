# Remote models are not sized here; their window is a property of the provider's model (override per profile if smaller).
[remote]
window_tokens = 131072

# ---------------------------------------------------------------------------------------------------------------------
# Context layers: the share of a model's usable window (c_eff) each layer may take. One table per role; each sums to 100.
# output: reserved for the answer; system: instructions + tool schemas; procedural: selected skills and playbook rules;
# task: spec + pinned capsules (must-have); working: the files being changed; tools: live tool results; episodic: past
# attempts and runs; semantic: project facts and decisions; session: this run's state.
# ---------------------------------------------------------------------------------------------------------------------
[layers.T1]          # tiny model: classification, rubric, summaries. No history.
output = 25
system = 15
procedural = 5
task = 40
working = 15
tools = 0
episodic = 0
semantic = 0
session = 0

[layers.T2]          # local coder
output = 20
system = 8
procedural = 7
task = 15
working = 30
tools = 12
episodic = 3
semantic = 3
session = 2

[layers.T3]          # planner (remote): needs the project's facts and history more than file bodies
output = 25
system = 6
procedural = 8
task = 15
working = 12
tools = 4
episodic = 10
semantic = 14
session = 6

[layers.reviewer]    # reviews a diff against the spec
output = 15
system = 6
procedural = 5
task = 20
working = 40
tools = 6
episodic = 3
semantic = 3
session = 2

# ---------------------------------------------------------------------------------------------------------------------
# Tool, MCP and skill output in the transcript
# ---------------------------------------------------------------------------------------------------------------------
[tools]
per_result_pct = 4               # one builtin tool result, % of the window, before head/tail shaping
mcp_per_result_pct = 2           # MCP output is third-party and untrusted: half the builtin share
keep_recent_results = 3          # older results are cleared to a one-line stub with a reference to the full text
offload_over_pct = 1             # results larger than this % of the window are stored in full as a blob
compact_at_pct = 80              # when the transcript reaches this % of (window - output), clear, then compact
head_pct = 40                    # of a shaped result: kept from the start
tail_pct = 60                    # kept from the end (errors and test summaries live at the end)

[skills]
index_pct = 20                   # of the procedural layer: names + descriptions of every skill (progressive disclosure)
max_bodies = 2                   # at most this many full skill bodies per call

# ---------------------------------------------------------------------------------------------------------------------
# Retention. Shares of the memory database's row budget, which is itself derived from device.disk_free_pct.
# ---------------------------------------------------------------------------------------------------------------------
[retention]
avg_row_bytes = 2048             # used only to turn the disk share into a row budget
episodic_pct = 45
semantic_pct = 25
procedural_pct = 10
session_pct = 20
min_score_pct = 15               # below this relevance (% of the best match) an item is never included
promote_after = 2                # an episodic lesson seen in this many runs becomes a semantic fact or playbook rule
retire_harmful_pct = 60          # a playbook rule whose outcomes are this % harmful is retired

[beta]
tree_rag = false                 # tree-based retrieval (memory stays as data; a navigator chooses branches)
tree_navigator = "lexical"       # lexical (deterministic, no model) | model (T1 picks branches, lexical fallback)
tree_beam = 3                    # branches opened per level
tree_max_depth = 4
