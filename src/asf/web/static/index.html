<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Viewer</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="run-header"><span id="run-title">Factory run</span> <span id="run-status" class="pill"></span> <span id="connection" class="muted"></span></header>
<aside id="participants" aria-label="Participants"></aside>
<main id="thread" aria-live="polite"></main>
<section id="detail" hidden>
  <button type="button" id="detail-close">Close</button>
  <h2 id="detail-title"></h2>
  <pre id="detail-text"></pre>
</section>
<footer><label><input type="checkbox" id="show-internal"> show internal events</label> <span class="muted">read-only view; it cannot change the run</span></footer>
<script src="/static/app.js"></script>
</body>
</html>
