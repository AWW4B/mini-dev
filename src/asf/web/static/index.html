<!--

ROLE: The single read-only viewer page: an agent group conversation with an agent list, message thread, details sheet and internal-events switch (Apple-style layout).

OWNS: Viewer front-end (no build step, no Node)
DOES NOT OWN: Data (served by server.py)
CONNECTS TO (external boundaries only):
  - called by src/asf/web/server.py: served as a static file
  - emits/consumes: none
INSTRUCTIONS (strict, imperative):
  1. Implement only this file. If this file's contract with another file must change, stop and report; do not edit the other file.
  2. Keep every public name and signature declared below exactly as written; they are the contract other files rely on.
  3. Use only the standard library, the pinned dependencies in pyproject.toml, and the files listed under CONNECTS TO. Ask before adding a dependency.
  4. Open text files with encoding="utf-8" explicitly.
  5. Never use innerHTML, eval or inline event handlers; treat all event text as untrusted.
  6. No external CDNs; everything is served from 127.0.0.1.
  7. The page has no forms and issues only GET requests.
FORBIDDEN: shell=True; os.system; hardcoded absolute paths; container runtimes; importing project modules not listed under CONNECTS TO; printing secrets or API keys; write requests; third-party scripts

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Factory Viewer</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="run-header">
  <div class="bar-side"><span id="connection" class="conn" role="status">Connecting</span></div>
  <h1 id="run-title">Factory run</h1>
  <div class="bar-side end"><span id="run-status" class="pill"></span></div>
</header>
<aside id="participants" aria-label="Agents in this run"></aside>
<main id="thread" role="log" aria-live="polite" aria-label="Agent conversation" tabindex="-1"></main>
<button type="button" id="jump" hidden></button>
<div id="scrim" hidden></div>
<section id="detail" role="dialog" aria-labelledby="detail-title" hidden>
  <div class="grabber"></div>
  <div class="sheet-bar"><h2 id="detail-title">Details</h2><button type="button" id="detail-close">Done</button></div>
  <p id="detail-ref"></p>
  <pre id="detail-text"></pre>
</section>
<footer>
  <label class="switch-row"><span>Show internal events</span><input type="checkbox" id="show-internal" role="switch"></label>
  <span class="muted">Read-only view. It cannot change the run.</span>
</footer>
<script src="/static/app.js"></script>
</body>
</html>
